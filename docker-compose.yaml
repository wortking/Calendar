services:
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: calendar_php
    volumes:
      - ./backend:/var/www/html
      # vendor/ y var/ quedan en volúmenes nombrados (filesystem nativo de Linux)
      # en vez del bind mount de Windows: con miles de archivos pequeños, el
      # bind mount de Docker Desktop en Windows es órdenes de magnitud más
      # lento (cada stat()/open() cruza al host), lo que en modo dev de
      # Symfony (autoload + comprobación de frescura de caché en cada
      # request) provocaba latencias de 6-13s por petición.
      - php_vendor:/var/www/html/vendor
      - php_var:/var/www/html/var
    environment:
      DATABASE_URL: "postgresql://postgres:postgres_pass@database:5432/calendar_db?serverVersion=16&charset=utf8"
      MESSENGER_TRANSPORT_DSN: "redis://redis:6379/messages"
      MAILER_DSN: "smtp://mailpit:1025"
      REDIS_DSN: "redis://redis:6379"
    depends_on:
      - database
      - redis

  nginx:
    image: nginx:stable-alpine
    container_name: calendar_nginx
    ports:
      - "8081:80"
    volumes:
      - ./backend:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php

  database:
    image: postgres:16-alpine
    container_name: calendar_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_pass
      POSTGRES_DB: calendar_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: calendar_redis
    ports:
      - "6380:6379"

  mailpit:
    image: axllent/mailpit:latest
    container_name: calendar_mailpit
    ports:
      - "8026:8025"
      - "1026:1025"

  frontend:
    image: node:20-alpine
    container_name: calendar_frontend
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    volumes:
      - ./frontend:/app
      # Mismo motivo que php_vendor: node_modules tiene decenas de miles de
      # archivos, inviable sobre el bind mount de Windows.
      - frontend_node_modules:/app/node_modules
    ports:
      - "5174:5173"
    depends_on:
      - nginx

volumes:
  pgdata:
  php_vendor:
  php_var:
  frontend_node_modules:
