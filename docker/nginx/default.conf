server {
    listen 80;
    server_name localhost;
    root /var/www/html/public;

    # Debe alcanzar (o superar) upload_max_filesize de PHP: nginx rechaza el
    # request antes de que llegue a PHP-FPM si lo supera, con un 413.
    client_max_body_size 6M;

    # Headers de seguridad básicos. HSTS se añade en producción, cuando haya
    # HTTPS delante (forzarlo aquí rompería el acceso por http:// en dev).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass php:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        internal;
    }

    location ~ \.php$ {
        return 404;
    }

    error_log /var/log/nginx/project_error.log;
    access_log /var/log/nginx/project_access.log;
}
